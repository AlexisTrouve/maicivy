# CI publique (GitHub) — build + tests du backend Go et du frontend Next.js.
#
# POURQUOI ce fichier vit dans `.github-public/` sur `main` : le dépôt de travail est sur Gitea, dont
# le runner lit `.github/workflows/`. Un job `runs-on: ubuntu-latest` posé là serait servi par un
# runner auto-hébergé (ou resterait en file pour toujours). La synchro vers GitHub (cf.
# .claude/SYNC_GITHUB.md) copie ce dossier dans `.github/workflows/` de la branche publique, à la
# place des workflows Gitea.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Go) — vet, build, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      # `-short` : miniredis + sqlite, sans service Postgres/Redis ni navigateur.
      - name: go test
        run: go test -short ./...

  frontend:
    name: Frontend (Next.js) — lint, types, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci
        run: npm ci --legacy-peer-deps
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run type-check
      - name: Unit tests (Jest)
        run: npx jest --ci
      - name: Build
        run: npm run build
