# CI/CD maicivy — tourne sur le runner Gitea Actions auto-hébergé (act_runner sur VPS142).
#  - test-backend : runs-on ubuntu-latest (job dans un container) — tests Go courts.
#  - deploy       : runs-on host (directement sur le VPS) — git pull + docker compose up --build.
# Le job deploy ne nécessite NI SSH NI secrets : le runner est sur le VPS, il déploie en local.
name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GO_VERSION: '1.24'

jobs:
  # ---- Gate de tests : doit passer avant tout déploiement -------------------
  test-backend:
    name: Test Backend (short)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      # `-short` : utilise miniredis et skip les tests d'intégration → aucun service DB/Redis requis.
      - name: Run backend tests (short)
        working-directory: backend
        run: go test ./... -short

  # ---- Déploiement sur l'hôte VPS (uniquement si les tests passent) ----------
  deploy:
    name: Deploy to VPS
    needs: [test-backend]
    runs-on: host
    steps:
      - name: Pull + rebuild + health check
        run: |
          set -e
          cd /home/debian/maicivy
          # Filet de rollback avant rebuild
          docker tag maicivy-backend:latest maicivy-backend:rollback-auto 2>/dev/null || true
          git fetch origin main
          git reset --hard origin/main
          # Build backend + frontend depuis la source, recrée les containers modifiés.
          docker compose up -d --build
          # Force-recreate backend (--no-deps) pour appliquer tout changement d'env/compose
          # (un simple up -d ne recrée pas sur un changement d'env seul).
          docker compose up -d --no-deps --force-recreate backend
          sleep 20
          curl -sf http://localhost:8081/health >/dev/null
          echo "Deploy OK: $(git rev-parse --short HEAD)"
