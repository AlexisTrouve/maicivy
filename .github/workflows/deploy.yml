# CI/CD maicivy — tourne sur le runner Gitea Actions auto-hébergé (act_runner sur VPS142).
#  - test-backend : runs-on ubuntu-latest (job dans un container) — tests Go courts.
#  - deploy       : runs-on host (directement sur le VPS) — git pull + docker compose up --build.
# Le job deploy ne nécessite NI SSH NI secrets : le runner est sur le VPS, il déploie en local.
name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GO_VERSION: '1.24'

jobs:
  # ---- Gate de tests : doit passer avant tout déploiement -------------------
  test-backend:
    name: Test Backend (short)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      # `-short` : utilise miniredis et skip les tests d'intégration → aucun service DB/Redis requis.
      - name: Run backend tests (short)
        working-directory: backend
        run: go test ./... -short

  # ---- Déploiement sur l'hôte VPS (uniquement si les tests passent) ----------
  deploy:
    name: Deploy to VPS
    needs: [test-backend]
    runs-on: host
    steps:
      # Ce job N'A PLUS sa propre logique de déploiement : il appelle le MÊME script que
      # le timer systemd (infra/autodeploy/auto-deploy.sh).
      #
      # POURQUOI : les deux avaient chacun leur copie (tag rollback, reset --hard, compose
      # up --build) et aucun verrou commun. Un push proche d'un tick du timer lançait donc
      # deux `docker compose up --build` concurrents sur le même projet ; le second recréait
      # les conteneurs que le premier venait de démarrer → SIGTERM au backend tout neuf →
      # `exited (0)` → deploy en échec. 3 fois en 30 jours, dont un 502 en prod.
      #
      # En appelant le script partagé, ce job hérite aussi du retour arrière sur échec, de
      # l'alerte Discord et du garde-fou anti-boucle — qui n'existaient pas dans cette copie.
      #
      # MAICIVY_LOCK_WAIT : ce job est déclenché par un push précis, il doit donc ATTENDRE
      # son tour plutôt que sauter (contrairement au timer, qui est un simple poller).
      # Verrou non obtenu à temps = échec franc, jamais un « OK » silencieux.
      #
      # La COPIE dans /tmp n'est pas cosmétique : le script fait `git reset --hard` sur le
      # dépôt qui le contient, donc il se réécrirait lui-même pendant que bash le lit (bash
      # lit un script par morceaux) → ordre des commandes brouillé. L'unité systemd fait la
      # même chose, avec un chemin DIFFÉRENT : deux copies vers le même fichier temporaire
      # se corrompraient mutuellement, la copie ayant lieu avant la prise du verrou.
      - name: Deploy (script partagé, verrou commun avec le timer systemd)
        run: |
          set -e
          cp /home/debian/maicivy/infra/autodeploy/auto-deploy.sh /tmp/maicivy-deploy-ci.sh
          MAICIVY_LOCK_WAIT=600 bash /tmp/maicivy-deploy-ci.sh
