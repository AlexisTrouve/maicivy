<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0f172a"/>
  
  <!-- Title -->
  <text x="600" y="40" font-size="32" font-weight="bold" fill="#ffffff" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
    Melodicode: LSP Slash Commands & Memory
  </text>
  
  <!-- Decorative line -->
  <line x1="150" y1="60" x2="1050" y2="60" stroke="#38bdf8" stroke-width="2"/>
  
  <!-- Left section: LSP -->
  <rect x="80" y="110" width="280" height="480" fill="none" stroke="#a78bfa" stroke-width="2" rx="8"/>
  <text x="220" y="145" font-size="18" font-weight="bold" fill="#a78bfa" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
    LSP Integration
  </text>
  
  <!-- LSP components -->
  <circle cx="220" cy="200" r="35" fill="#a78bfa" opacity="0.1" stroke="#a78bfa" stroke-width="2"/>
  <text x="220" y="205" font-size="12" fill="#a78bfa" text-anchor="middle" font-family="monospace" font-weight="bold">
    Server
  </text>
  
  <rect x="140" y="270" width="160" height="60" fill="none" stroke="#38bdf8" stroke-width="2" rx="4"/>
  <text x="220" y="295" font-size="13" fill="#38bdf8" text-anchor="middle" font-family="monospace">
    /define
  </text>
  <text x="220" y="315" font-size="13" fill="#38bdf8" text-anchor="middle" font-family="monospace">
    /analyze
  </text>
  
  <text x="220" y="360" font-size="12" fill="#2dd4bf" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
    Slash Commands
  </text>
  
  <polygon points="220,410 200,440 240,440" fill="#38bdf8" opacity="0.6"/>
  <text x="220" y="475" font-size="11" fill="#ffffff" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" max-width="240">
    Real-time Code
  </text>
  <text x="220" y="490" font-size="11" fill="#ffffff" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
    Intelligence
  </text>
  
  <!-- Center section: Architecture -->
  <rect x="420" y="110" width="360" height="480" fill="none" stroke="#38bdf8" stroke-width="2" rx="8"/>
  <text x="600" y="145" font-size="18" font-weight="bold" fill="#38bdf8" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
    Core Architecture
  </text>
  
  <!-- Memory box -->
  <rect x="450" y="180" width="300" height="80" fill="#2dd4bf" opacity="0.15" stroke="#2dd4bf" stroke-width="2" rx="4"/>
  <text x="600" y="205" font-size="14" font-weight="bold" fill="#2dd4bf" text-anchor="middle" font-family="monospace">
    Memory System
  </text>
  <text x="600" y="230" font-size="11" fill="#ffffff" text-anchor="middle" font-family="monospace">
    Context | History | State
  </text>
  <text x="600" y="250" font-size="10" fill="#2dd4bf" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
    Persistent Knowledge Base
  </text>
  
  <!-- Processing -->
  <rect x="450" y="290" width="300" height="70" fill="#a78bfa" opacity="0.15" stroke="#a78bfa" stroke-width="2" rx="4"/>
  <text x="600" y="315" font-size="13" font-weight="bold" fill="#a78bfa" text-anchor="middle" font-family="monospace">
    Command Processor
  </text>
  <text x="600" y="340" font-size="10" fill="#ffffff" text-anchor="middle" font-family="monospace">
    Parse → Execute → Return
  </text>
  
  <!-- Output -->
  <rect x="450" y="390" width="300" height="70" fill="#38bdf8" opacity="0.15" stroke="#38bdf8" stroke-width="2" rx="4"/>
  <text x="600" y="415" font-size="13" font-weight="bold" fill="#38bdf8" text-anchor="middle" font-family="monospace">
    IDE Integration
  </text>
  <text x="600" y="440" font-size="10" fill="#ffffff" text-anchor="middle" font-family="monospace">
    Hover Hints | Completions
  </text>
  
  <!-- Right section: Features -->
  <rect x="840" y="110" width="280" height="480" fill="none" stroke="#2dd4bf" stroke-width="2" rx="8"/>
  <text x="980" y="145" font-size="18" font-weight="bold" fill="#2dd4bf" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
    Key Features
  </text>
  
  <!-- Feature boxes -->
  <g>
    <rect x="860" y="170" width="240" height="50" fill="#38bdf8" opacity="0.1" stroke="#38bdf8" stroke-width="1" rx="4"/>
    <text x="980" y="192" font-size="12" font-weight="bold" fill="#38bdf8" text-anchor="middle" font-family="monospace">
      Smart Completions
    </text>
    <text x="980" y="210" font-size="9" fill="#ffffff" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
      Context-aware
    </text>
  </g>
  
  <g>
    <rect x="860" y="240" width="240" height="50" fill="#a78bfa" opacity="0.1" stroke="#a78bfa" stroke-width="1" rx="4"/>
    <text x="980" y="262" font-size="12" font-weight="bold" fill="#a78bfa" text-anchor="middle" font-family="monospace">
      Memory Recall
    </text>
    <text x="980" y="280" font-size="9" fill="#ffffff" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
      Learning enabled
    </text>
  </g>
  
  <g>
    <rect x="860" y="310" width="240" height="50" fill="#2dd4bf" opacity="0.1" stroke="#2dd4bf" stroke-width="1" rx="4"/>
    <text x="980" y="332" font-size="12" font-weight="bold" fill="#2dd4bf" text-anchor="middle" font-family="monospace">
      Code Analysis
    </text>
    <text x="980" y="350" font-size="9" fill="#ffffff" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
      Patterns & insights
    </text>
  </g>
  
  <g>
    <rect x="860" y="380" width="240" height="50" fill="#38bdf8" opacity="0.1" stroke="#38bdf8" stroke-width="1" rx="4"/>
    <text x="980" y="402" font-size="12" font-weight="bold" fill="#38bdf8" text-anchor="middle" font-family="monospace">
      Fast Response
    </text>
    <text x="980" y="420" font-size="9" fill="#ffffff" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
      Low latency
    </text>
  </g>
  
  <!-- Connection arrows -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#38bdf8"/>
    </marker>
    <marker id="arrowhead-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#a78bfa"/>
    </marker>
  </defs>
  
  <!-- Arrow: LSP to Core -->
  <path d="M 360 350 L 420 350" stroke="#38bdf8" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow: Core to IDE -->
  <path d="M 780 350 L 840 350" stroke="#2dd4bf" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Bottom accent -->
  <line x1="150" y1="610" x2="1050" y2="610" stroke="#a78bfa" stroke-width="1" opacity="0.5"/>
</svg>