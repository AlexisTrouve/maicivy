<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a2847;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2dd4bf;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Title -->
  <text x="600" y="50" font-size="36" font-weight="bold" text-anchor="middle" fill="#f1f5f9" font-family="system-ui, -apple-system, sans-serif">
    Maicivy: Evolution Majeure
  </text>
  <text x="600" y="85" font-size="20" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif">
    Technical Documentation & Development Platform
  </text>
  
  <!-- Left Box: Documentation -->
  <rect x="80" y="140" width="280" height="440" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="220" y="175" font-size="18" font-weight="bold" text-anchor="middle" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif">
    📚 Documentation
  </text>
  
  <line x1="100" y1="190" x2="340" y2="190" stroke="#38bdf8" stroke-width="1" opacity="0.3"/>
  
  <circle cx="140" cy="240" r="6" fill="#38bdf8"/>
  <text x="160" y="245" font-size="14" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif">
    API References
  </text>
  
  <circle cx="140" cy="290" r="6" fill="#38bdf8"/>
  <text x="160" y="295" font-size="14" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif">
    Code Snippets
  </text>
  
  <circle cx="140" cy="340" r="6" fill="#38bdf8"/>
  <text x="160" y="345" font-size="14" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif">
    Best Practices
  </text>
  
  <circle cx="140" cy="390" r="6" fill="#38bdf8"/>
  <text x="160" y="395" font-size="14" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif">
    Architecture Guides
  </text>
  
  <circle cx="140" cy="440" r="6" fill="#38bdf8"/>
  <text x="160" y="445" font-size="14" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif">
    Examples & Tutorials
  </text>
  
  <circle cx="140" cy="490" r="6" fill="#38bdf8"/>
  <text x="160" y="495" font-size="14" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif">
    Troubleshooting
  </text>
  
  <!-- Center Box: Core Platform -->
  <rect x="460" y="140" width="280" height="440" rx="12" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <text x="600" y="175" font-size="18" font-weight="bold" text-anchor="middle" fill="#a78bfa" font-family="system-ui, -apple-system, sans-serif">
    ⚙️ Platform Core
  </text>
  
  <line x1="480" y1="190" x2="720" y2="190" stroke="#a78bfa" stroke-width="1" opacity="0.3"/>
  
  <circle cx="540" cy="240" r="6" fill="#a78bfa"/>
  <text x="560" y="245" font-size="14" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif">
    Smart Indexing
  </text>
  
  <circle cx="540" cy="290" r="6" fill="#a78bfa"/>
  <text x="560" y="295" font-size="14" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif">
    Full-Text Search
  </text>
  
  <circle cx="540" cy="340" r="6" fill="#a78bfa"/>
  <text x="560" y="345" font-size="14" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif">
    Version Control
  </text>
  
  <circle cx="540" cy="390" r="6" fill="#a78bfa"/>
  <text x="560" y="395" font-size="14" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif">
    Collaboration Tools
  </text>
  
  <circle cx="540" cy="440" r="6" fill="#a78bfa"/>
  <text x="560" y="445" font-size="14" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif">
    Analytics Engine
  </text>
  
  <circle cx="540" cy="490" r="6" fill="#a78bfa"/>
  <text x="560" y="495" font-size="14" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif">
    DevOps Integration
  </text>
  
  <!-- Right Box: Development -->
  <rect x="840" y="140" width="280" height="440" rx="12" fill="#1e293b" stroke="#2dd4bf" stroke-width="2"/>
  <text x="980" y="175" font-size="18" font-weight="bold" text-anchor="middle" fill="#2dd4bf" font-family="system-ui, -apple-system, sans-serif">
    💻 Development
  </text>
  
  <line x1="860" y1="190" x2="1100" y2="190" stroke="#2dd4bf" stroke-width="1" opacity="0.3"/>
  
  <circle cx="920" cy="240" r="6" fill="#2dd4bf"/>
  <text x="940" y="245" font-size="14" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif">
    Local Development
  </text>
  
  <circle cx="920" cy="290" r="6" fill="#2dd4bf"/>
  <text x="940" y="295" font-size="14" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif">
    Testing Framework
  </text>
  
  <circle cx="920" cy="340" r="6" fill="#2dd4bf"/>
  <text x="940" y="345" font-size="14" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif">
    CI/CD Pipeline
  </text>
  
  <circle cx="920" cy="390" r="6" fill="#2dd4bf"/>
  <text x="940" y="395" font-size="14" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif">
    Deployment Tools
  </text>
  
  <circle cx="920" cy="440" r="6" fill="#2dd4bf"/>
  <text x="940" y="445" font-size="14" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif">
    Performance Monitoring
  </text>
  
  <circle cx="920" cy="490" r="6" fill="#2dd4bf"/>
  <text x="940" y="495" font-size="14" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif">
    Security Audits
  </text>
  
  <!-- Connection Arrows -->
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#a78bfa"/>
    </marker>
    <marker id="arrowTeal" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2dd4bf"/>
    </marker>
  </defs>
  
  <!-- Arrows connecting boxes -->
  <path d="M 360 360 L 460 360" stroke="#38bdf8" stroke-width="2" fill="none" marker-end="url(#arrowBlue)" opacity="0.6"/>
  <path d="M 740 360 L 840 360" stroke="#a78bfa" stroke-width="2" fill="none" marker-end="url(#arrowPurple)" opacity="0.6"/>
  
  <!-- Bottom accent line -->
  <rect x="0" y="620" width="1200" height="10" fill="url(#accentGradient)"/>
</svg>