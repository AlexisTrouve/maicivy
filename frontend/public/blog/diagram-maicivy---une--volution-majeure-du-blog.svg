    </text>
    <text x="660" y="445" font-size="11" fill="#cbd5e1" font-family="monospace">
      • Image optimization
    </text>
    <text x="660" y="465" font-size="11" fill="#cbd5e1" font-family="monospace">
      • Code splitting
    </text>
    <text x="660" y="485" font-size="11" fill="#cbd5e1" font-family="monospace">
      • Lazy loading
    </text>
    <text x="660" y="505" font-size="11" fill="#cbd5e1" font-family="monospace">
      • Metrics & monitoring
    </text>
    <text x="660" y="525" font-size="11" fill="#cbd5e1" font-family="monospace">
      • Analytics
    </text>
  </g>
  
  <!-- Tools Box -->
  <g>
    <rect x="920" y="370" width="220" height="180" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="6"/>
    <text x="1030" y="395" font-size="14" font-weight="bold" text-anchor="middle" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif">
      Outils & DevOps
    </text>
    <text x="930" y="425" font-size="11" fill="#cbd5e1" font-family="monospace">
      • Build tools
    </text>
    <text x="930" y="445" font-size="11" fill="#cbd5e1" font-family="monospace">
      • Testing framework
    </text>
    <text x="930" y="465" font-size="11" fill="#cbd5e1" font-family="monospace">
      • Linting & formatting
    </text>
    <text x="930" y="485" font-size="11" fill="#cbd5e1" font-family="monospace">
      • Docker & containers
    </text>
    <text x="930" y="505" font-size="11" fill="#cbd5e1" font-family="monospace">
      • Version control
    </text>
    <text x="930" y="525" font-size="11" fill="#cbd5e1" font-family="monospace">
      • Documentation gen
    </text>
  </g>
  
  <!-- Bottom footer -->
  <line x1="100" y1="600" x2="1100" y2="600" stroke="#38bdf8" stroke-width="1" opacity="0.2"/>
  <text x="600" y="620" font-size="13" text-anchor="middle" fill="#64748b" font-family="system-ui, -apple-system, sans-serif">
    Full-Stack Modern Expertise • Blog Performant • Documentation Complète • Navigation Optimisée
  </text>
</svg>