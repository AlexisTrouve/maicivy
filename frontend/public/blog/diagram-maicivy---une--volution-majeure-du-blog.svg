    <marker id="arrowhead-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#38bdf8"/>
    </marker>
    <marker id="arrowhead-teal" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#2dd4bf"/>
    </marker>
    <marker id="arrowhead-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#a78bfa"/>
    </marker>
  </defs>
  
  <!-- Arrow from Blog to Markdown -->
  <path d="M 320 200 L 480 200" stroke="#38bdf8" stroke-width="2" fill="none" marker-end="url(#arrowhead-blue)" opacity="0.6"/>
  
  <!-- Arrow from Markdown to Frontend -->
  <path d="M 720 200 L 880 200" stroke="#2dd4bf" stroke-width="2" fill="none" marker-end="url(#arrowhead-teal)" opacity="0.6"/>
  
  <!-- Documentation Section -->
  <rect x="80" y="310" width="1040" height="280" fill="#1e293b" stroke="#a78bfa" stroke-width="2" rx="8" opacity="0.5"/>
  
  <!-- Documentation Title -->
  <text x="600" y="345" font-size="20" font-weight="bold" text-anchor="middle" fill="#a78bfa" font-family="system-ui, -apple-system, sans-serif">
    📚 Documentation Complète
  </text>
  
  <!-- Documentation Grid -->
  
  <!-- Architecture Box -->
  <g>
    <rect x="110" y="370" width="220" height="180" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="6"/>
    <text x="220" y="395" font-size="14" font-weight="bold" text-anchor="middle" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif">
      Architecture
    </text>
    <text x="120" y="425" font-size="11" fill="#cbd5e1" font-family="monospace">
      • Structure modulaire
    </text>
    <text x="120" y="445" font-size="11" fill="#cbd5e1" font-family="monospace">
      • Patterns design
    </text>
    <text x="120" y="465" font-size="11" fill="#cbd5e1" font-family="monospace">
      • Scalabilité
    </text>
    <text x="120" y="485" font-size="11" fill="#cbd5e1" font-family="monospace">
      • Stack full-stack
    </text>
    <text x="120" y="505" font-size="11" fill="#cbd5e1" font-family="monospace">
      • CI/CD pipeline
    </text>
    <text x="120" y="525" font-size="11" fill="#cbd5e1" font-family="monospace">
      • Déploiement
    </text>
  </g>
  
  <!-- API Box -->
  <g>
    <rect x="380" y="370" width="220" height="180" fill="#0f172a" stroke="#2dd4bf" stroke-width="1.5" rx="6"/>
    <text x="490" y="395" font-size="14" font-weight="bold" text-anchor="middle" fill="#2dd4bf" font-family="system-ui, -apple-system, sans-serif">
      API & Backend
    </text>
    <text x="390" y="425" font-size="11" fill="#cbd5e1" font-family="monospace">
      • RESTful endpoints
    </text>
    <text x="390" y="445" font-size="11" fill="#cbd5e1" font-family="monospace">
      • Authentification
    </text>
    <text x="390" y="465" font-size="11" fill="#cbd5e1" font-family="monospace">
      • Cache strategy
    </text>
    <text x="390" y="485" font-size="11" fill="#cbd5e1" font-family="monospace">
      • Rate limiting
    </text>
    <text x="390" y="505" font-size="11" fill="#cbd5e1" font-family="monospace">
      • Validation
    </text>
    <text x="390" y="525" font-size="11" fill="#cbd5e1" font-family="monospace">
      • Error handling
    </text>
  </g>
  
  <!-- Performance Box -->
  <g>
    <rect x="650" y="370" width="220" height="180" fill="#0f172a" stroke="#a78bfa" stroke-width="1.5" rx="6"/>
    <text x="760" y="395" font-size="14" font-weight="bold" text-anchor="middle" fill="#a78bfa" font-family="system-ui, -apple-system, sans-serif">
      Performance
    </text>
    <text x="660" y="425" font-size="11" fill="#cbd5e1" font-family="monospace">
