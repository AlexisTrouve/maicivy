<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0f172a"/>
  
  <!-- Title -->
  <text x="600" y="40" font-size="32" font-weight="bold" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif">
    Maicivy: Évolution Majeure
  </text>
  <text x="600" y="70" font-size="18" text-anchor="middle" fill="#a78bfa" font-family="system-ui, -apple-system, sans-serif">
    Blog Technique & Documentation Complète
  </text>
  
  <!-- Top divider -->
  <line x1="100" y1="90" x2="1100" y2="90" stroke="#38bdf8" stroke-width="2" opacity="0.3"/>
  
  <!-- Main components boxes -->
  
  <!-- Blog Component -->
  <g>
    <!-- Box -->
    <rect x="80" y="130" width="240" height="140" fill="#1e293b" stroke="#38bdf8" stroke-width="2" rx="8"/>
    
    <!-- Icon circle -->
    <circle cx="130" cy="160" r="20" fill="#38bdf8" opacity="0.2"/>
    <text x="130" y="165" font-size="24" text-anchor="middle" fill="#38bdf8">📝</text>
    
    <!-- Title -->
    <text x="200" y="160" font-size="16" font-weight="bold" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif">
      Blog
    </text>
    
    <!-- Features -->
    <text x="100" y="190" font-size="12" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif">
      • Articles Markdown
    </text>
    <text x="100" y="210" font-size="12" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif">
      • Performance optimisée
    </text>
    <text x="100" y="230" font-size="12" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif">
      • SEO-friendly
    </text>
    <text x="100" y="250" font-size="12" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif">
      • Syntaxe highlight
    </text>
  </g>
  
  <!-- Markdown Component -->
  <g>
    <!-- Box -->
    <rect x="480" y="130" width="240" height="140" fill="#1e293b" stroke="#2dd4bf" stroke-width="2" rx="8"/>
    
    <!-- Icon circle -->
    <circle cx="530" cy="160" r="20" fill="#2dd4bf" opacity="0.2"/>
    <text x="530" y="165" font-size="24" text-anchor="middle" fill="#2dd4bf">{'{'}</text>
    
    <!-- Title -->
    <text x="600" y="160" font-size="16" font-weight="bold" fill="#2dd4bf" font-family="system-ui, -apple-system, sans-serif">
      Markdown
    </text>
    
    <!-- Features -->
    <text x="500" y="190" font-size="12" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif">
      • Parser avancé
    </text>
    <text x="500" y="210" font-size="12" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif">
      • Code blocks
    </text>
    <text x="500" y="230" font-size="12" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif">
      • Tables & listes
    </text>
    <text x="500" y="250" font-size="12" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif">
      • Métadonnées YAML
    </text>
  </g>
  
  <!-- Frontend Component -->
  <g>
    <!-- Box -->
    <rect x="880" y="130" width="240" height="140" fill="#1e293b" stroke="#a78bfa" stroke-width="2" rx="8"/>
    
    <!-- Icon circle -->
    <circle cx="930" cy="160" r="20" fill="#a78bfa" opacity="0.2"/>
    <text x="930" y="165" font-size="24" text-anchor="middle" fill="#a78bfa">🎨</text>
    
    <!-- Title -->
    <text x="1000" y="160" font-size="16" font-weight="bold" fill="#a78bfa" font-family="system-ui, -apple-system, sans-serif">
