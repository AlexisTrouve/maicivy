<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark background -->
  <rect width="1200" height="630" fill="#0f172a"/>
  
  <!-- Title -->
  <text x="600" y="45" font-size="32" font-weight="bold" text-anchor="middle" fill="#ffffff" font-family="system-ui">
    From CLI Tool to Code-Intelligent IDE
  </text>
  <text x="600" y="80" font-size="18" text-anchor="middle" fill="#8b5cf6" font-family="system-ui">
    LSP, Slash Commands, and TDD Round 4
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="110" font-size="13" text-anchor="middle" fill="#94a3b8" font-family="system-ui">
    Adding Language Server Protocol Integration to melodicode
  </text>
  
  <!-- Left column: CLI Tool -->
  <rect x="50" y="150" width="280" height="440" rx="8" fill="none" stroke="#3b82f6" stroke-width="2"/>
  <text x="190" y="180" font-size="14" font-weight="bold" text-anchor="middle" fill="#3b82f6" font-family="system-ui">
    CLI Tool (Before)
  </text>
  
  <!-- CLI Tool components -->
  <circle cx="110" cy="230" r="30" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="110" y="235" font-size="11" text-anchor="middle" fill="#3b82f6" font-family="monospace">
    CLI
  </text>
  
  <circle cx="270" cy="230" r="30" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="270" y="235" font-size="11" text-anchor="middle" fill="#3b82f6" font-family="monospace">
    Parser
  </text>
  
  <line x1="140" y1="230" x2="240" y2="230" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  
  <!-- CLI components below -->
  <rect x="70" y="310" width="220" height="35" rx="6" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="180" y="333" font-size="12" text-anchor="middle" fill="#3b82f6" font-family="monospace">
    TDD Round 1-3: Core Parsing
  </text>
  
  <rect x="70" y="365" width="220" height="35" rx="6" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="180" y="388" font-size="12" text-anchor="middle" fill="#3b82f6" font-family="monospace">
    Limited Context / Stateless
  </text>
  
  <rect x="70" y="420" width="220" height="35" rx="6" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="180" y="443" font-size="12" text-anchor="middle" fill="#3b82f6" font-family="monospace">
    One-shot Commands
  </text>
  
  <!-- Center column: Evolution -->
  <g>
    <!-- Arrow between sections -->
    <line x1="330" y1="370" x2="440" y2="370" stroke="#8b5cf6" stroke-width="2.5" marker-end="url(#arrowPurple)"/>
    <text x="385" y="360" font-size="12" text-anchor="middle" fill="#8b5cf6" font-family="system-ui">
      Evolution
    </text>
  </g>
  
  <!-- Right column: IDE with LSP -->
  <rect x="460" y="150" width="280" height="440" rx="8" fill="none" stroke="#10b981" stroke-width="2"/>
  <text x="600" y="180" font-size="14" font-weight="bold" text-anchor="middle" fill="#10b981" font-family="system-ui">
    Code-Intelligent IDE (After)
  </text>
  
  <!-- IDE components -->
  <rect x="480" y="210" width="240" height="45" rx="6" fill="none" stroke="#10b981" stroke-width="1.5"/>
  <text x="600" y="240" font-size="12" text-anchor="middle" fill="#10b981" font-family="system-ui">
    🔌 Language Server Protocol (LSP)
  </text>
  
  <!-- LSP internals -->
  <circle cx="520" cy="310" r="25" fill="none" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="520" y="315" font-size="10" text-anchor="middle" fill="#06b6d4" font-family="monospace">
    Session
  </text>
  
  <circle cx="600" cy="310" r="25" fill="none" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="600" y="315" font-size="10" text-anchor="middle" fill="#06b6d4" font-family="monospace">
    Parser
  </text>
  
  <circle cx="680" cy="310" r="25" fill="none" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="680" y="315" font-size="10" text-anchor="middle" fill="#06b6d4" font-family="monospace">
    Agents
  </text>
  
  <!-- Arrows between LSP components -->
  <line x1="545" y1="310" x2="575" y2="310" stroke="#06b6d4" stroke-width="1.5"/>
  <line x1="625" y1="310" x2="655" y2="310" stroke="#06b6d4" stroke-width="1.5"/>
  
  <!-- IDE features below -->
  <rect x="480" y="370" width="240" height="35" rx="6" fill="none" stroke="#10b981" stroke-width="1.5"/>
  <text x="600" y="393" font-size="12" text-anchor="middle" fill="#10b981" font-family="monospace">
    /slash Commands
  </text>
  
  <rect x="480" y="425" width="240" height="35" rx="6" fill="none" stroke="#10b981" stroke-width="1.5"/>
  <text x="600" y="448" font-size="12" text-anchor="middle" fill="#10b981" font-family="monospace">
    Persistent Context (TDD R4)
  </text>
  
  <!-- Far right column: Key Insights -->
  <rect x="870" y="150" width="280" height="440" rx="8" fill="none" stroke="#8b5cf6" stroke-width="2"/>
  <text x="1010" y="180" font-size="14" font-weight="bold" text-anchor="middle" fill="#8b5cf6" font-family="system-ui">
    TDD Round 4 Insights
  </text>
  
  <!-- Insights -->
  <g>
    <!-- Insight 1 -->
    <rect x="890" y="210" width="240" height="60" rx="6" fill="none" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="1010" y="230" font-size="11" font-weight="bold" text-anchor="middle" fill="#8b5cf6" font-family="system-ui">
      Production-Grade Parsing
    </text>
    <text x="1010" y="250" font-size="10" text-anchor="middle" fill="#e2e8f0" font-family="system-ui">
      Dart AST complexity
    </text>
    <text x="1010" y="263" font-size="10" text-anchor="middle" fill="#e2e8f0" font-family="system-ui">
      revealed edge cases
    </text>
  </g>
  
  <g>
    <!-- Insight 2 -->
    <rect x="890" y="295" width="240" height="60" rx="6" fill="none" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="1010" y="315" font-size="11" font-weight="bold" text-anchor="middle" fill="#8b5cf6" font-family="system-ui">
      Session Persistence
    </text>
    <text x="1010" y="335" font-size="10" text-anchor="middle" fill="#e2e8f0" font-family="system-ui">
      Stateful conversation
    </text>
    <text x="1010" y="348" font-size="10" text-anchor="middle" fill="#e2e8f0" font-family="system-ui">
      over time
    </text>
  </g>
  
  <g>
    <!-- Insight 3 -->
    <rect x="890" y="380" width="240" height="60" rx="6" fill="none" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="1010" y="400" font-size="11" font-weight="bold" text-anchor="middle" fill="#8b5cf6" font-family="system-ui">
      AI Agent Architecture
    </text>
    <text x="1010" y="420" font-size="10" text-anchor="middle" fill="#e2e8f0" font-family="system-ui">
      Tool use + streaming
    </text>
    <text x="1010" y="433" font-size="10" text-anchor="middle" fill="#e2e8f0" font-family="system-us">
      for real-time UX
    </text>
  </g>
  
  <!-- Bottom: Architecture flow -->
  <g>
    <text x="50" y="610" font-size="11" fill="#94a3b8" font-family="monospace">
      CLI stdin/stdout  →  LSP JSON-RPC  →  Slash Commands  →  Persistent Sessions
    </text>
  </g>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8b5cf6"/>
    </marker>
    <marker id="arrowCyan" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#06b6d4"/>
    </marker>
  </defs>
</svg>