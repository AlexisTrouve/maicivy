<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0f172a"/>
  
  <!-- Title -->
  <text x="600" y="40" font-size="32" font-weight="bold" text-anchor="middle" fill="#ffffff" font-family="system-ui">
    Melodicode Gets a Brain
  </text>
  <text x="600" y="70" font-size="16" text-anchor="middle" fill="#94a3b8" font-family="system-ui">
    LSP • Slash Commands • CLAUDE.md Management
  </text>
  
  <!-- Divider line -->
  <line x1="100" y1="90" x2="1100" y2="90" stroke="#334155" stroke-width="1"/>
  
  <!-- Left component: Editor/IDE -->
  <g>
    <!-- Box -->
    <rect x="80" y="130" width="240" height="180" fill="#1e293b" stroke="#3b82f6" stroke-width="2" rx="8"/>
    
    <!-- Icon -->
    <circle cx="110" cy="160" r="20" fill="#3b82f6" opacity="0.2"/>
    <text x="110" y="168" font-size="24" text-anchor="middle" fill="#3b82f6">⚙️</text>
    
    <!-- Text -->
    <text x="200" y="160" font-size="14" font-weight="bold" fill="#ffffff" font-family="system-ui">Editor Layer</text>
    <line x1="100" y1="175" x2="300" y2="175" stroke="#3b82f6" stroke-width="1"/>
    
    <text x="100" y="200" font-size="12" fill="#cbd5e1" font-family="monospace">• Slash commands</text>
    <text x="100" y="225" font-size="12" fill="#cbd5e1" font-family="monospace">• Code completion</text>
    <text x="100" y="250" font-size="12" fill="#cbd5e1" font-family="monospace">• Go to definition</text>
    <text x="100" y="275" font-size="12" fill="#cbd5e1" font-family="monospace">• Real-time hints</text>
  </g>
  
  <!-- Center component: LSP Server -->
  <g>
    <!-- Box -->
    <rect x="460" y="130" width="280" height="180" fill="#1e293b" stroke="#8b5cf6" stroke-width="2" rx="8"/>
    
    <!-- Icon -->
    <circle cx="500" cy="160" r="20" fill="#8b5cf6" opacity="0.2"/>
    <text x="500" y="168" font-size="24" text-anchor="middle" fill="#8b5cf6">🧠</text>
    
    <!-- Text -->
    <text x="570" y="160" font-size="14" font-weight="bold" fill="#ffffff" font-family="system-ui">LSP + AI Brain</text>
    <line x1="480" y1="175" x2="720" y2="175" stroke="#8b5cf6" stroke-width="1"/>
    
    <text x="480" y="200" font-size="12" fill="#cbd5e1" font-family="monospace">• Language semantics</text>
    <text x="480" y="225" font-size="12" fill="#cbd5e1" font-family="monospace">• Flutter/Dart awareness</text>
    <text x="480" y="250" font-size="12" fill="#cbd5e1" font-family="monospace">• AI agent routing</text>
    <text x="480" y="275" font-size="12" fill="#cbd5e1" font-family="monospace">• Context management</text>
  </g>
  
  <!-- Right component: CLAUDE.md -->
  <g>
    <!-- Box -->
    <rect x="880" y="130" width="240" height="180" fill="#1e293b" stroke="#06b6d4" stroke-width="2" rx="8"/>
    
    <!-- Icon -->
    <circle cx="910" cy="160" r="20" fill="#06b6d4" opacity="0.2"/>
    <text x="910" y="168" font-size="24" text-anchor="middle" fill="#06b6d4">📄</text>
    
    <!-- Text -->
    <text x="980" y="160" font-size="14" font-weight="bold" fill="#ffffff" font-family="system-ui">CLAUDE.md</text>
    <line x1="900" y1="175" x2="1100" y2="175" stroke="#06b6d4" stroke-width="1"/>
    
    <text x="900" y="200" font-size="12" fill="#cbd5e1" font-family="monospace">• Project rules</text>
    <text x="900" y="225" font-size="12" fill="#cbd5e1" font-family="monospace">• Context guides</text>
    <text x="900" y="250" font-size="12" fill="#cbd5e1" font-family="monospace">• Prompt templates</text>
    <text x="900" y="275" font-size="12" fill="#cbd5e1" font-family="monospace">• Custom instructions</text>
  </g>
  
  <!-- Arrows showing connections -->
  <!-- Editor to LSP -->
  <g>
    <defs>
      <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L0,6 L9,3 z" fill="#3b82f6"/>
      </marker>
      <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L0,6 L9,3 z" fill="#8b5cf6"/>
      </marker>
      <marker id="arrowCyan" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L0,6 L9,3 z" fill="#06b6d4"/>
      </marker>
    </defs>
    
    <!-- Editor -> LSP (bidirectional) -->
    <path d="M 320 200 L 460 200" stroke="#3b82f6" stroke-width="2" fill="none" marker-end="url(#arrowPurple)"/>
    <path d="M 460 220 L 320 220" stroke="#3b82f6" stroke-width="2" fill="none" marker-end="url(#arrowBlue)" opacity="0.6"/>
    <text x="380" y="190" font-size="11" fill="#60a5fa" font-family="system-ui">LSP Protocol</text>
    
    <!-- LSP -> CLAUDE.md -->
    <path d="M 740 200 L 880 200" stroke="#8b5cf6" stroke-width="2" fill="none" marker-end="url(#arrowCyan)"/>
    <text x="800" y="190" font-size="11" fill="#a78bfa" font-family="system-ui">Context Loading</text>
  </g>
  
  <!-- Bottom section: Features/Flow -->
  <rect x="80" y="350" width="1040" height="240" fill="#1e293b" stroke="#334155" stroke-width="1" rx="8" opacity="0.5"/>
  
  <!-- Feature boxes -->
  <!-- Feature 1: Syntax Awareness -->
  <g>
    <rect x="100" y="370" width="220" height="200" fill="#0f172a" stroke="#10b981" stroke-width="1.5" rx="8"/>
    <circle cx="130" cy="395" r="18" fill="#10b981" opacity="0.2"/>
    <text x="130" y="403" font-size="20" text-anchor="middle" fill="#10b981">✓</text>
    <text x="170" y="398" font-size="13" font-weight="bold" fill="#ffffff" font-family="system-ui">Syntax Awareness</text>
    <line x1="110" y1="410" x2="310" y2="410" stroke="#10b981" stroke-width="1" opacity="0.5"/>
    <text x="110" y="435" font-size="11" fill="#cbd5e1" font-family="monospace">Parse Flutter code</text>
    <text x="110" y="455" font-size="11" fill="#cbd5e1" font-family="monospace">Understand context</text>
    <text x="110" y="475" font-size="11" fill="#cbd5e1" font-family="monospace">Type-aware analysis</text>
    <text x="110" y="495" font-size="11" fill="#cbd5e1" font-family="monospace">Semantic awareness</text>
    <text x="110" y="515" font-size="11" fill="#cbd5e1" font-family="monospace">Smart routing to agents</text>
  </g>
  
  <!-- Feature 2: Smart Commands -->
  <g>
    <rect x="360" y="370" width="220" height="200" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5" rx="8"/>
    <circle cx="390" cy="395" r="18" fill="#3b82f6" opacity="0.2"/>
    <text x="390" y="403" font-size="20" text-anchor="middle" fill="#3b82f6">/</text>
    <text x="430" y="398" font-size="13" font-weight="bold" fill="#ffffff" font-family="system-ui">Slash Commands</text>
    <line x1="370" y1="410" x2="570" y2="410" stroke="#3b82f6" stroke-width="1" opacity="0.5"/>
    <text x="370" y="435" font-size="11" fill="#cbd5e1" font-family="monospace">/explain code</text>
    <text x="370" y="455" font-size="11" fill="#cbd5e1" font-family="monospace">/optimize widget</text>
    <text x="370" y="475" font-size="11" fill="#cbd5e1" font-family="monospace">/fix lint issues</text>
    <text x="370" y="495" font-size="11" fill="#cbd5e1" font-family="monospace">/add tests</text>
    <text x="370" y="515" font-size="11" fill="#cbd5e1" font-family="monospace">/refactor pattern</text>
  </g>
  
  <!-- Feature 3: Context Management -->
  <g>
    <rect x="620" y="370" width="220" height="200" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.5" rx="8"/>
    <circle cx="650" cy="395" r="18" fill="#8b5cf6" opacity="0.2"/>
    <text x="650" y="403" font-size="20" text-anchor="middle" fill="#8b5cf6">📦</text>
    <text x="690" y="398" font-size="13" font-weight="bold" fill="#ffffff" font-family="system-ui">Context Engine</text>
    <line x1="630" y1="410" x2="830" y2="410" stroke="#8b5cf6" stroke-width="1" opacity="0.5"/>
    <text x="630" y="435" font-size="11" fill="#cbd5e1" font-family="monospace">Load CLAUDE.md</text>
    <text x="630" y="455" font-size="11" fill="#cbd5e1" font-family="monospace">Extract rules</text>
    <text x="630" y="475" font-size="11" fill="#cbd5e1" font-family="monospace">Build prompts</text>
    <text x="630" y="495" font-size="11" fill="#cbd5e1" font-family="monospace">Inject context</text>
    <text x="630" y="515" font-size="11" fill="#cbd5e1" font-family="monospace">Feed to agents</text>
  </g>
  
  <!-- Feature 4: Agent Integration -->
  <g>
    <rect x="880" y="370" width="220" height="200" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5" rx="8"/>
    <circle cx="910" cy="395" r="18" fill="#06b6d4" opacity="0.2"/>
    <text x="910" y="403" font-size="20" text-anchor="middle" fill="#06b6d4">🤖</text>
    <text x="950" y="398" font-size="13" font-weight="bold" fill="#ffffff" font-family="system-ui">AI Agents</text>
    <line x1="890" y1="410" x2="1090" y2="410" stroke="#06b6d4" stroke-width="1" opacity="0.5"/>
    <text x="890" y="435" font-size="11" fill="#cbd5e1" font-family="monospace">Multi-agent dispatch</text>
    <text x="890" y="455" font-size="11" fill="#cbd5e1" font-family="monospace">Task orchestration</text>
    <text x="890" y="475" font-size="11" fill="#cbd5e1" font-family="monospace">Parallel execution</text>
    <text x="890" y="495" font-size="11" fill="#cbd5e1" font-family="monospace">Results synthesis</text>
    <text x="890" y="515" font-size="11" fill="#cbd5e1" font-family="monospace">Code insertion</text>
  </g>
</svg>