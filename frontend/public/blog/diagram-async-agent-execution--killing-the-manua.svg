<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0f172a"/>
  
  <!-- Title -->
  <text x="600" y="45" font-size="32" font-weight="bold" text-anchor="middle" fill="#ffffff" font-family="system-ui">
    Async Agent Execution
  </text>
  <text x="600" y="75" font-size="20" text-anchor="middle" fill="#06b6d4" font-family="system-ui">
    Killing the Manual Listen/Talk/Relay Loop
  </text>
  
  <!-- Divider line -->
  <line x1="100" y1="95" x2="1100" y2="95" stroke="#3b82f6" stroke-width="1" opacity="0.3"/>
  
  <!-- OLD WAY - Left side -->
  <text x="300" y="135" font-size="16" font-weight="bold" fill="#ef4444" font-family="system-ui">
    ❌ Manual Loop
  </text>
  
  <!-- Old boxes -->
  <rect x="180" y="160" width="120" height="50" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
  <text x="240" y="192" font-size="12" text-anchor="middle" fill="#ffffff" font-family="system-ui">
    Listen
  </text>
  
  <path d="M 310 185 L 350 185" stroke="#ef4444" stroke-width="2" fill="none" marker-end="url(#arrowRed)"/>
  
  <rect x="360" y="160" width="120" height="50" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
  <text x="420" y="192" font-size="12" text-anchor="middle" fill="#ffffff" font-family="system-ui">
    Talk
  </text>
  
  <path d="M 490 185 L 530 185" stroke="#ef4444" stroke-width="2" fill="none" marker-end="url(#arrowRed)"/>
  
  <rect x="540" y="160" width="120" height="50" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
  <text x="600" y="192" font-size="12" text-anchor="middle" fill="#ffffff" font-family="system-ui">
    Relay
  </text>
  
  <!-- Loop arrow back -->
  <path d="M 240 160 Q 240 130 420 130 Q 600 130 600 160" stroke="#ef4444" stroke-width="2" fill="none" stroke-dasharray="5,5" marker-end="url(#arrowRed)"/>
  <text x="420" y="125" font-size="10" text-anchor="middle" fill="#ef4444" font-family="monospace">
    repeat
  </text>
  
  <!-- Manual effort indicator -->
  <text x="420" y="235" font-size="11" text-anchor="middle" fill="#fca5a5" font-family="monospace">
    Manual orchestration
  </text>
  <text x="420" y="250" font-size="11" text-anchor="middle" fill="#fca5a5" font-family="monospace">
    Error-prone loops
  </text>
  
  <!-- NEW WAY - Right side -->
  <text x="900" y="135" font-size="16" font-weight="bold" fill="#10b981" font-family="system-ui">
    ✓ Async Agent Flow
  </text>
  
  <!-- Agent box at top right -->
  <rect x="780" y="160" width="240" height="70" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
  <text x="900" y="185" font-size="13" font-weight="bold" text-anchor="middle" fill="#8b5cf6" font-family="system-ui">
    AI Agent
  </text>
  <text x="900" y="205" font-size="11" text-anchor="middle" fill="#d1d5db" font-family="monospace">
    Command Executor
  </text>
  <text x="900" y="220" font-size="10" text-anchor="middle" fill="#9ca3af" font-family="monospace">
    + Tool Results Handler
  </text>
  
  <!-- Flow down -->
  <path d="M 900 230 L 900 280" stroke="#10b981" stroke-width="2" fill="none" marker-end="url(#arrowGreen)"/>
  
  <!-- Async execution box -->
  <rect x="780" y="280" width="240" height="70" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="2"/>
  <text x="900" y="305" font-size="13" font-weight="bold" text-anchor="middle" fill="#06b6d4" font-family="system-ui">
    Async Execution
  </text>
  <text x="900" y="325" font-size="11" text-anchor="middle" fill="#d1d5db" font-family="monospace">
    Background Commands
  </text>
  <text x="900" y="340" font-size="10" text-anchor="middle" fill="#9ca3af" font-family="monospace">
    Non-blocking Results
  </text>
  
  <!-- Flow down -->
  <path d="M 900 350 L 900 400" stroke="#10b981" stroke-width="2" fill="none" marker-end="url(#arrowGreen)"/>
  
  <!-- Notifications box -->
  <rect x="780" y="400" width="240" height="70" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="900" y="425" font-size="13" font-weight="bold" text-anchor="middle" fill="#3b82f6" font-family="system-ui">
    Native Notifications
  </text>
  <text x="900" y="445" font-size="11" text-anchor="middle" fill="#d1d5db" font-family="monospace">
    Event-driven Updates
  </text>
  <text x="900" y="460" font-size="10" text-anchor="middle" fill="#9ca3af" font-family="monospace">
    No Manual Polling
  </text>
  
  <!-- Benefits section -->
  <text x="150" y="310" font-size="13" font-weight="bold" fill="#3b82f6" font-family="system-ui">
    Key Benefits:
  </text>
  
  <circle cx="170" cy="345" r="4" fill="#10b981"/>
  <text x="190" y="350" font-size="11" fill="#d1d5db" font-family="monospace">
    Single responsibility
  </text>
  
  <circle cx="170" cy="375" r="4" fill="#10b981"/>
  <text x="190" y="380" font-size="11" fill="#d1d5db" font-family="monospace">
    Testable (55+ tests ✓)
  </text>
  
  <circle cx="170" cy="405" r="4" fill="#10b981"/>
  <text x="190" y="410" font-size="11" fill="#d1d5db" font-family="monospace">
    No race conditions
  </text>
  
  <circle cx="170" cy="435" r="4" fill="#10b981"/>
  <text x="190" y="440" font-size="11" fill="#d1d5db" font-family="monospace">
    Built-in error handling
  </text>
  
  <circle cx="170" cy="465" r="4" fill="#10b981"/>
  <text x="190" y="470" font-size="11" fill="#d1d5db" font-family="monospace">
    Scalable & maintainable
  </text>
  
  <!-- Tech stack at bottom -->
  <text x="150" y="515" font-size="11" font-weight="bold" fill="#8b5cf6" font-family="monospace">
    Stack: Flutter • Dart • AI Agents • Async/await • TDD
  </text>
  
  <!-- Project name -->
  <text x="1050" y="600" font-size="12" fill="#64748b" font-family="monospace" text-anchor="end">
    Melodicode
  </text>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#ef4444"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#10b981"/>
    </marker>
  </defs>
</svg>