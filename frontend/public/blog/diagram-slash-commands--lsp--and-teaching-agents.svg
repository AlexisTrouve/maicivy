<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>

  <!-- Title -->
  <text x="600" y="40" font-size="32" font-weight="bold" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif">
    Slash Commands, LSP, and Code Intelligence
  </text>

  <!-- Main Components -->
  <!-- Slash Commands Box -->
  <rect x="80" y="100" width="220" height="180" rx="8" fill="none" stroke="#38bdf8" stroke-width="2" filter="url(#glow)"/>
  <text x="190" y="125" font-size="14" font-weight="bold" text-anchor="middle" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif">
    /Slash Commands
  </text>
  <line x1="100" y1="135" x2="280" y2="135" stroke="#38bdf8" stroke-width="1" opacity="0.3"/>
  <text x="100" y="160" font-size="12" fill="#e0e7ff" font-family="monospace">
    • User Input Handler
  </text>
  <text x="100" y="180" font-size="12" fill="#e0e7ff" font-family="monospace">
    • Command Parser
  </text>
  <text x="100" y="200" font-size="12" fill="#e0e7ff" font-family="monospace">
    • Action Routing
  </text>
  <text x="100" y="220" font-size="12" fill="#e0e7ff" font-family="monospace">
    • Response Stream
  </text>
  <text x="100" y="240" font-size="12" fill="#e0e7ff" font-family="monospace">
    • Melodicode Integration
  </text>

  <!-- LSP Box -->
  <rect x="380" y="100" width="220" height="180" rx="8" fill="none" stroke="#a78bfa" stroke-width="2" filter="url(#glow)"/>
  <text x="490" y="125" font-size="14" font-weight="bold" text-anchor="middle" fill="#a78bfa" font-family="system-ui, -apple-system, sans-serif">
    Language Server Protocol
  </text>
  <line x1="400" y1="135" x2="580" y2="135" stroke="#a78bfa" stroke-width="1" opacity="0.3"/>
  <text x="400" y="160" font-size="12" fill="#e0e7ff" font-family="monospace">
    • Code Analysis
  </text>
  <text x="400" y="180" font-size="12" fill="#e0e7ff" font-family="monospace">
    • Symbol Resolution
  </text>
  <text x="400" y="200" font-size="12" fill="#e0e7ff" font-family="monospace">
    • Type Information
  </text>
  <text x="400" y="220" font-size="12" fill="#e0e7ff" font-family="monospace">
    • Diagnostics API
  </text>
  <text x="400" y="240" font-size="12" fill="#e0e7ff" font-family="monospace">
    • Hover Definitions
  </text>

  <!-- AI Agents Box -->
  <rect x="680" y="100" width="220" height="180" rx="8" fill="none" stroke="#2dd4bf" stroke-width="2" filter="url(#glow)"/>
  <text x="790" y="125" font-size="14" font-weight="bold" text-anchor="middle" fill="#2dd4bf" font-family="system-ui, -apple-system, sans-serif">
    AI Agents
  </text>
  <line x1="700" y1="135" x2="880" y2="135" stroke="#2dd4bf" stroke-width="1" opacity="0.3"/>
  <text x="700" y="160" font-size="12" fill="#e0e7ff" font-family="monospace">
    • Code Context
  </text>
  <text x="700" y="180" font-size="12" fill="#e0e7ff" font-family="monospace">
    • AST Understanding
  </text>
  <text x="700" y="200" font-size="12" fill="#e0e7ff" font-family="monospace">
    • Semantic Analysis
  </text>
  <text x="700" y="220" font-size="12" fill="#e0e7ff" font-family="monospace">
    • Code Generation
  </text>
  <text x="700" y="240" font-size="12" fill="#e0e7ff" font-family="monospace">
    • Real Intelligence
  </text>

  <!-- Arrow: Slash Commands → LSP -->
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#a78bfa"/>
    </marker>
    <marker id="arrowTeal" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2dd4bf"/>
    </marker>
  </defs>

  <line x1="300" y1="190" x2="380" y2="190" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowBlue)" opacity="0.6"/>
  <text x="340" y="175" font-size="11" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">
    triggers
  </text>

  <!-- Arrow: LSP → AI Agents -->
  <line x1="600" y1="190" x2="680" y2="190" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrowPurple)" opacity="0.6"/>
  <text x="640" y="175" font-size="11" fill="#a78bfa" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">
    feeds intelligence
  </text>

  <!-- Bottom Section: Languages & Technologies -->
  <text x="600" y="340" font-size="13" font-weight="bold" text-anchor="middle" fill="#a78bfa" font-family="system-ui, -apple-system, sans-serif">
    Technologies & Languages
  </text>

  <!-- Flutter Badge -->
  <rect x="280" y="360" width="110" height="40" rx="6" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.7"/>
  <text x="335" y="387" font-size="12" font-weight="bold" text-anchor="middle" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif">
    Flutter
  </text>

  <!-- Dart Badge -->
  <rect x="420" y="360" width="110" height="40" rx="6" fill="none" stroke="#a78bfa" stroke-width="1.5" opacity="0.7"/>
  <text x="475" y="387" font-size="12" font-weight="bold" text-anchor="middle" fill="#a78bfa" font-family="system-ui, -apple-system, sans-serif">
    Dart
  </text>

  <!-- LSP Badge -->
  <rect x="560" y="360" width="110" height="40" rx="6" fill="none" stroke="#2dd4bf" stroke-width="1.5" opacity="0.7"/>
  <text x="615" y="387" font-size="12" font-weight="bold" text-anchor="middle" fill="#2dd4bf" font-family="system-ui, -apple-system, sans-serif">
    LSP
  </text>

  <!-- AI Agents Badge -->
  <rect x="700" y="360" width="140" height="40" rx="6" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.7"/>
  <text x="770" y="387" font-size="12" font-weight="bold" text-anchor="middle" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif">
    AI Agents
  </text>

  <!-- Key Insight Box -->
  <rect x="140" y="460" width="920" height="100" rx="8" fill="none" stroke="#2dd4bf" stroke-width="2" opacity="0.6"/>
  <text x="600" y="490" font-size="13" font-weight="bold" text-anchor="middle" fill="#2dd4bf" font-family="system-ui, -apple-system, sans-serif">
    Real Code Intelligence
  </text>
  <text x="160" y="520" font-size="11" fill="#e0e7ff" font-family="system-ui, -apple-system, sans-serif">
    LSP enables AI agents to move beyond text editing — accessing semantic code information,
  </text>
  <text x="160" y="540" font-size="11" fill="#e0e7ff" font-family="system-ui, -apple-system, sans-serif">
    type definitions, and AST understanding. Slash commands provide the user interface for
  </text>
  <text x="160" y="560" font-size="11" fill="#e0e7ff" font-family="system-ui, -apple-system, sans-serif">
    triggering intelligent code transformations in Melodicode.
  </text>
</svg>