<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0f172a"/>
  
  <!-- Title -->
  <text x="600" y="40" font-size="28" font-weight="bold" fill="#f8fafc" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
    Persistent Multi-Agent IDE Architecture
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="65" font-size="14" fill="#cbd5e1" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
    LSP Integration • Session State • Slash Commands
  </text>
  
  <!-- Top Section: User Interface Layer -->
  <g>
    <!-- Flutter UI Box -->
    <rect x="50" y="100" width="280" height="120" fill="#1e293b" stroke="#38bdf8" stroke-width="2" rx="8"/>
    <text x="190" y="125" font-size="16" font-weight="bold" fill="#38bdf8" text-anchor="middle" font-family="monospace">
      Flutter UI
    </text>
    <text x="190" y="155" font-size="12" fill="#cbd5e1" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
      Editor Interface
    </text>
    <text x="190" y="175" font-size="12" fill="#cbd5e1" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
      Real-time Display
    </text>
    <text x="190" y="195" font-size="12" fill="#cbd5e1" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
      Command Palette
    </text>
  </g>
  
  <!-- Top Section: LSP Client -->
  <g>
    <!-- LSP Client Box -->
    <rect x="460" y="100" width="280" height="120" fill="#1e293b" stroke="#a78bfa" stroke-width="2" rx="8"/>
    <text x="600" y="125" font-size="16" font-weight="bold" fill="#a78bfa" text-anchor="middle" font-family="monospace">
      Language Server
    </text>
    <text x="600" y="155" font-size="12" fill="#cbd5e1" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
      Protocol (LSP)
    </text>
    <text x="600" y="175" font-size="12" fill="#cbd5e1" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
      Diagnostics
    </text>
    <text x="600" y="195" font-size="12" fill="#cbd5e1" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
      Code Intelligence
    </text>
  </g>
  
  <!-- Top Section: Agent Engine -->
  <g>
    <!-- Agent Box -->
    <rect x="870" y="100" width="280" height="120" fill="#1e293b" stroke="#2dd4bf" stroke-width="2" rx="8"/>
    <text x="1010" y="125" font-size="16" font-weight="bold" fill="#2dd4bf" text-anchor="middle" font-family="monospace">
      AI Agent Engine
    </text>
    <text x="1010" y="155" font-size="12" fill="#cbd5e1" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
      Tool Execution
    </text>
    <text x="1010" y="175" font-size="12" fill="#cbd5e1" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
      Slash Commands
    </text>
    <text x="1010" y="195" font-size="12" fill="#cbd5e1" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
      Multi-Agent Loop
    </text>
  </g>
  
  <!-- Arrow 1: UI to LSP -->
  <path d="M 330 160 L 460 160" stroke="#38bdf8" stroke-width="2" fill="none" marker-end="url(#arrowblue)"/>
  
  <!-- Arrow 2: UI to Agent -->
  <path d="M 330 200 Q 600 250 870 180" stroke="#2dd4bf" stroke-width="2" fill="none" marker-end="url(#arrowteal)"/>
  
  <!-- Arrow 3: LSP to Agent -->
  <path d="M 740 160 L 870 160" stroke="#a78bfa" stroke-width="2" fill="none" marker-end="url(#arrowpurple)"/>
  
  <!-- Middle Section: Session State Management -->
  <g>
    <rect x="50" y="300" width="1100" height="140" fill="#1e293b" stroke="#38bdf8" stroke-width="2" rx="8"/>
    
    <text x="600" y="325" font-size="14" font-weight="bold" fill="#38bdf8" text-anchor="middle" font-family="monospace">
      Session State Layer
    </text>
    
    <!-- State Box 1 -->
    <rect x="80" y="345" width="200" height="80" fill="#0f172a" stroke="#a78bfa" stroke-width="1" rx="4"/>
    <text x="180" y="370" font-size="12" font-weight="bold" fill="#a78bfa" text-anchor="middle" font-family="monospace">
      Agent State
    </text>
    <text x="180" y="390" font-size="11" fill="#cbd5e1" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
      Messages
    </text>
    <text x="180" y="405" font-size="11" fill="#cbd5e1" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
      Artifacts
    </text>
    <text x="180" y="420" font-size="11" fill="#cbd5e1" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
      Tools Executed
    </text>
    
    <!-- State Box 2 -->
    <rect x="320" y="345" width="200" height="80" fill="#0f172a" stroke="#2dd4bf" stroke-width="1" rx="4"/>
    <text x="420" y="370" font-size="12" font-weight="bold" fill="#2dd4bf" text-anchor="middle" font-family="monospace">
      Slash Commands
    </text>
    <text x="420" y="390" font-size="11" fill="#cbd5e1" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
      Command Registry
    </text>
    <text x="420" y="405" font-size="11" fill="#cbd5e1" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
      Execution History
    </text>
    <text x="420" y="420" font-size="11" fill="#cbd5e1" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
      Parameters
    </text>
    
    <!-- State Box 3 -->
    <rect x="560" y="345" width="200" height="80" fill="#0f172a" stroke="#38bdf8" stroke-width="1" rx="4"/>
    <text x="660" y="370" font-size="12" font-weight="bold" fill="#38bdf8" text-anchor="middle" font-family="monospace">
      LSP Context
    </text>
    <text x="660" y="390" font-size="11" fill="#cbd5e1" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
      File State
    </text>
    <text x="660" y="405" font-size="11" fill="#cbd5e1" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
      Diagnostics
    </text>
    <text x="660" y="420" font-size="11" fill="#cbd5e1" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
      Workspace
    </text>
    
    <!-- State Box 4 -->
    <rect x="800" y="345" width="200" height="80" fill="#0f172a" stroke="#a78bfa" stroke-width="1" rx="4"/>
    <text x="900" y="370" font-size="12" font-weight="bold" fill="#a78bfa" text-anchor="middle" font-family="monospace">
      Persistence
    </text>
    <text x="900" y="390" font-size="11" fill="#cbd5e1" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
      Database/JSON
    </text>
    <text x="900" y="405" font-size="11" fill="#cbd5e1" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
      Recovery
    </text>
    <text x="900" y="420" font-size="11" fill="#cbd5e1" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
      Indexing
    </text>
  </g>
  
  <!-- Bottom Section: Data Flow -->
  <g>
    <!-- Read Arrow -->
    <path d="M 190 240 L 180 300" stroke="#38bdf8" stroke-width="2" fill="none" marker-end="url(#arrowblue)" stroke-dasharray="5,5"/>
    <text x="130" y="270" font-size="11" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif">
      Read/Write
    </text>
    
    <!-- Command Flow -->
    <path d="M 600 220 L 420 300" stroke="#2dd4bf" stroke-width="2" fill="none" marker-end="url(#arrowteal)"/>
    <text x="540" y="255" font-size="11" fill="#2dd4bf" font-family="system-ui, -apple-system, sans-serif">
      Slash Command
    </text>
    
    <!-- LSP Sync -->
    <path d="M 740 220 L 660 300" stroke="#a78bfa" stroke-width="2" fill="none" marker-end="url(#arrowpurple)"/>
    <text x="710" y="255" font-size="11" fill="#a78bfa" font-family="system-ui, -apple-system, sans-serif">
      LSP Events
    </text>
    
    <!-- Persist -->
    <path d="M 1010 220 L 900 300" stroke="#a78bfa" stroke-width="2" fill="none" marker-end="url(#arrowpurple)" stroke-dasharray="5,5"/>
    <text x="970" y="255" font-size="11" fill="#a78bfa" font-family="system-ui, -apple-system, sans-serif">
      Persist
    </text>
  </g>
  
  <!-- Bottom Info Section -->
  <g>
    <text x="60" y="530" font-size="13" font-weight="bold" fill="#2dd4bf" font-family="monospace">
      • Dart + Flutter: Cross-platform IDE foundation
    </text>
    <text x="60" y="555" font-size="13" font-weight="bold" fill="#a78bfa" font-family="monospace">
      • LSP: Standard language intelligence protocol
    </text>
    <text x="60" y="580" font-size="13" font-weight="bold" fill="#38bdf8" font-family="monospace">
      • Session Persistence: Agents survive application restarts
    </text>
    <text x="600" y="530" font-size="13" font-weight="bold" fill="#2dd4bf" font-family="monospace">
      • Multi-Agent Loop: Collaborative tool execution
    </text>
    <text x="600" y="555" font-size="13" font-weight="bold" fill="#a78bfa" font-family="monospace">
      • Slash Commands: User-triggered agent actions
    </text>
    <text x="600" y="580" font-size="13" font-weight="bold" fill="#38bdf8" font-family="monospace">
      • Ephemeral → Persistent: From tool to IDE
    </text>
  </g>
  
  <!-- Arrow Markers -->
  <defs>
    <marker id="arrowblue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowpurple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#a78bfa"/>
    </marker>
    <marker id="arrowteal" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2dd4bf"/>
    </marker>
  </defs>
</svg>