<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0f172a"/>
  
  <!-- Title -->
  <text x="600" y="45" font-size="32" font-weight="bold" fill="#38bdf8" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
    Multi-Agent IDE with LSP
  </text>
  <text x="600" y="75" font-size="16" fill="#a78bfa" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
    Session State &amp; Slash Commands Architecture
  </text>
  
  <!-- Left Section: LSP Server -->
  <rect x="50" y="120" width="280" height="480" fill="none" stroke="#38bdf8" stroke-width="2" rx="8"/>
  <text x="190" y="155" font-size="18" font-weight="bold" fill="#38bdf8" text-anchor="middle" font-family="monospace">
    LSP Server
  </text>
  
  <!-- LSP Components -->
  <rect x="70" y="175" width="240" height="70" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" rx="4"/>
  <text x="190" y="200" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle" font-family="monospace">
    Language Protocol
  </text>
  <text x="190" y="220" font-size="11" fill="#cbd5e1" text-anchor="middle" font-family="monospace">
    Diagnostics, Completion
  </text>
  <text x="190" y="235" font-size="11" fill="#cbd5e1" text-anchor="middle" font-family="monospace">
    Code Navigation
  </text>
  
  <rect x="70" y="270" width="240" height="70" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5" rx="4"/>
  <text x="190" y="295" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle" font-family="monospace">
    Session Manager
  </text>
  <text x="190" y="315" font-size="11" fill="#cbd5e1" text-anchor="middle" font-family="monospace">
    State Persistence
  </text>
  <text x="190" y="330" font-size="11" fill="#cbd5e1" text-anchor="middle" font-family="monospace">
    Context Tracking
  </text>
  
  <rect x="70" y="365" width="240" height="70" fill="#1e293b" stroke="#2dd4bf" stroke-width="1.5" rx="4"/>
  <text x="190" y="390" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle" font-family="monospace">
    Slash Command Handler
  </text>
  <text x="190" y="410" font-size="11" fill="#cbd5e1" text-anchor="middle" font-family="monospace">
    /refactor /analyze
  </text>
  <text x="190" y="425" font-size="11" fill="#cbd5e1" text-anchor="middle" font-family="monospace">
    /test /document
  </text>
  
  <rect x="70" y="460" width="240" height="70" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" rx="4"/>
  <text x="190" y="485" font-size="13" font-weight="600" fill="#e2e8f0" text-anchor="middle" font-family="monospace">
    Multi-Agent Orchestrator
  </text>
  <text x="190" y="505" font-size="11" fill="#cbd5e1" text-anchor="middle" font-family="monospace">
    Agent Coordination
  </text>
  <text x="190" y="520" font-size="11" fill="#cbd5e1" text-anchor="middle" font-family="monospace">
    Result Aggregation
  </text>
  
  <!-- Center Section: Data Flow -->
  <g>
    <!-- Arrow from LSP to Session Manager -->
    <path d="M 190 245 L 190 270" stroke="#38bdf8" stroke-width="2" fill="none" marker-end="url(#arrowblue)"/>
    
    <!-- Arrow from Session Manager to Slash Commands -->
    <path d="M 190 340 L 190 365" stroke="#a78bfa" stroke-width="2" fill="none" marker-end="url(#arrowpurple)"/>
    
    <!-- Arrow from Slash Commands to Agents -->
    <path d="M 190 435 L 190 460" stroke="#2dd4bf" stroke-width="2" fill="none" marker-end="url(#arrowteal)"/>
  </g>
  
  <!-- Right Section: Agent Network -->
  <rect x="870" y="120" width="280" height="480" fill="none" stroke="#a78bfa" stroke-width="2" rx="8"/>
  <text x="1010" y="155" font-size="18" font-weight="bold" fill="#a78bfa" text-anchor="middle" font-family="monospace">
    Agent Network
  </text>
  
  <!-- Agent Nodes -->
  <circle cx="920" cy="220" r="35" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="920" y="228" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle" font-family="monospace">
    Code
  </text>
  <text x="920" y="242" font-size="9" fill="#cbd5e1" text-anchor="middle" font-family="monospace">
    Agent
  </text>
  
  <circle cx="1010" cy="220" r="35" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <text x="1010" y="228" font-size="11" font-weight="600" fill="#a78bfa" text-anchor="middle" font-family="monospace">
    Docs
  </text>
  <text x="1010" y="242" font-size="9" fill="#cbd5e1" text-anchor="middle" font-family="monospace">
    Agent
  </text>
  
  <circle cx="1100" cy="220" r="35" fill="#1e293b" stroke="#2dd4bf" stroke-width="2"/>
  <text x="1100" y="228" font-size="11" font-weight="600" fill="#2dd4bf" text-anchor="middle" font-family="monospace">
    Test
  </text>
  <text x="1100" y="242" font-size="9" fill="#cbd5e1" text-anchor="middle" font-family="monospace">
    Agent
  </text>
  
  <!-- Central State Store -->
  <rect x="890" y="300" width="240" height="100" fill="#1e293b" stroke="#2dd4bf" stroke-width="2" rx="4"/>
  <text x="1010" y="330" font-size="13" font-weight="600" fill="#2dd4bf" text-anchor="middle" font-family="monospace">
    Shared State Store
  </text>
  <text x="1010" y="352" font-size="11" fill="#cbd5e1" text-anchor="middle" font-family="monospace">
    Context Memory
  </text>
  <text x="1010" y="368" font-size="11" fill="#cbd5e1" text-anchor="middle" font-family="monospace">
    Command History
  </text>
  <text x="1010" y="384" font-size="11" fill="#cbd5e1" text-anchor="middle" font-family="monospace">
    Artifacts &amp; Results
  </text>
  
  <!-- Agent Communication -->
  <path d="M 955 255 L 955 300" stroke="#38bdf8" stroke-width="1.5" fill="none" marker-end="url(#arrowblue)" stroke-dasharray="4,4"/>
  <path d="M 1010 255 L 1010 300" stroke="#a78bfa" stroke-width="1.5" fill="none" marker-end="url(#arrowpurple)" stroke-dasharray="4,4"/>
  <path d="M 1065 255 L 1065 300" stroke="#2dd4bf" stroke-width="1.5" fill="none" marker-end="url(#arrowteal)" stroke-dasharray="4,4"/>
  
  <!-- Persistence Layer -->
  <rect x="890" y="440" width="240" height="80" fill="#1e293b" stroke="#38bdf8" stroke-width="2" rx="4"/>
  <text x="1010" y="468" font-size="13" font-weight="600" fill="#38bdf8" text-anchor="middle" font-family="monospace">
    Persistent Storage
  </text>
  <text x="1010" y="488" font-size="11" fill="#cbd5e1" text-anchor="middle" font-family="monospace">
    Session Cache
  </text>
  <text x="1010" y="504" font-size="11" fill="#cbd5e1" text-anchor="middle" font-family="monospace">
    Workspace State
  </text>
  
  <!-- Arrow from State Store to Storage -->
  <path d="M 1010 400 L 1010 440" stroke="#38bdf8" stroke-width="2" fill="none" marker-end="url(#arrowblue)"/>
  
  <!-- Center Flow: Main Connection -->
  <path d="M 330 380 L 450 380" stroke="#38bdf8" stroke-width="2.5" fill="none" marker-end="url(#arrowblue)"/>
  <text x="390" y="370" font-size="11" fill="#38bdf8" font-family="monospace" text-anchor="middle">
    DISPATCH
  </text>
  
  <path d="M 870 380 L 750 380" stroke="#a78bfa" stroke-width="2.5" fill="none" marker-end="url(#arrowpurple)"/>
  <text x="810" y="370" font-size="11" fill="#a78bfa" font-family="monospace" text-anchor="middle">
    RESULTS
  </text>
  
  <!-- Legend -->
  <g>
    <text x="50" y="625" font-size="11" fill="#94a3b8" font-family="monospace">
      → State Flow  ⇢ Agent Communication
    </text>
  </g>
  
  <!-- Arrow Markers -->
  <defs>
    <marker id="arrowblue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowpurple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#a78bfa"/>
    </marker>
    <marker id="arrowteal" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2dd4bf"/>
    </marker>
  </defs>
</svg>