<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0f172a"/>
  
  <!-- Title -->
  <text x="600" y="40" font-size="32" font-weight="bold" text-anchor="middle" fill="#ffffff" font-family="system-ui">
    Giving AI Agents Real Code Intelligence
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="70" font-size="16" text-anchor="middle" fill="#94a3b8" font-family="system-ui">
    LSP, Slash Commands & Session Persistence in Melodicode
  </text>
  
  <!-- Main container boxes -->
  
  <!-- Left box: User Input -->
  <rect x="40" y="120" width="240" height="480" rx="8" fill="none" stroke="#3b82f6" stroke-width="2"/>
  <rect x="40" y="120" width="240" height="50" rx="8" fill="#3b82f6" opacity="0.1"/>
  <text x="160" y="155" font-size="14" font-weight="bold" text-anchor="middle" fill="#3b82f6" font-family="system-ui">
    User Input Layer
  </text>
  
  <!-- Slash commands icon -->
  <circle cx="160" cy="220" r="25" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="160" y="225" font-size="20" text-anchor="middle" fill="#3b82f6" font-family="monospace">/</text>
  <text x="160" y="255" font-size="12" text-anchor="middle" fill="#e2e8f0" font-family="system-ui">Slash Commands</text>
  
  <!-- Editor input -->
  <rect x="65" y="310" width="190" height="40" rx="4" fill="none" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="160" y="335" font-size="11" text-anchor="middle" fill="#c4b5fd" font-family="monospace">Real-time Code Input</text>
  
  <!-- Session state -->
  <rect x="65" y="380" width="190" height="40" rx="4" fill="none" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="160" y="405" font-size="11" text-anchor="middle" fill="#67e8f9" font-family="monospace">Session Context</text>
  
  <!-- Center box: LSP & Processing -->
  <rect x="340" y="120" width="280" height="480" rx="8" fill="none" stroke="#8b5cf6" stroke-width="2"/>
  <rect x="340" y="120" width="280" height="50" rx="8" fill="#8b5cf6" opacity="0.1"/>
  <text x="480" y="155" font-size="14" font-weight="bold" text-anchor="middle" fill="#8b5cf6" font-family="system-ui">
    LSP Processing Core
  </text>
  
  <!-- LSP Server -->
  <rect x="365" y="210" width="230" height="50" rx="6" fill="#8b5cf6" opacity="0.15" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="480" y="230" font-size="11" font-weight="bold" text-anchor="middle" fill="#d8b4fe" font-family="monospace">Language Server Protocol</text>
  <text x="480" y="250" font-size="10" text-anchor="middle" fill="#c4b5fd" font-family="monospace">Dart/Flutter Analysis</text>
  
  <!-- Code intelligence items -->
  <g>
    <!-- Hover info -->
    <circle cx="390" cy="340" r="18" fill="none" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="390" y="347" font-size="14" font-weight="bold" text-anchor="middle" fill="#06b6d4">i</text>
    <text x="470" y="347" font-size="11" fill="#cffafe" font-family="system-ui">Hover Definitions</text>
    
    <!-- Go to definition -->
    <circle cx="390" cy="395" r="18" fill="none" stroke="#10b981" stroke-width="1.5"/>
    <text x="390" y="401" font-size="14" font-weight="bold" text-anchor="middle" fill="#10b981">→</text>
    <text x="470" y="401" font-size="11" fill="#d1fae5" font-family="system-ui">Navigate Code</text>
    
    <!-- Completions -->
    <circle cx="390" cy="450" r="18" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="390" y="456" font-size="14" font-weight="bold" text-anchor="middle" fill="#f59e0b">✓</text>
    <text x="470" y="456" font-size="11" fill="#fed7aa" font-family="system-ui">Code Completions</text>
  </g>
  
  <!-- Diagnostics -->
  <rect x="365" y="520" width="230" height="50" rx="6" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="480" y="540" font-size="11" font-weight="bold" text-anchor="middle" fill="#93c5fd" font-family="monospace">Diagnostics & Analysis</text>
  <text x="480" y="560" font-size="10" text-anchor="middle" fill="#bfdbfe" font-family="monospace">Type Checking, Linting</text>
  
  <!-- Right box: AI Agent Intelligence -->
  <rect x="680" y="120" width="280" height="480" rx="8" fill="none" stroke="#10b981" stroke-width="2"/>
  <rect x="680" y="120" width="280" height="50" rx="8" fill="#10b981" opacity="0.1"/>
  <text x="820" y="155" font-size="14" font-weight="bold" text-anchor="middle" fill="#10b981" font-family="system-ui">
    AI Agent Intelligence
  </text>
  
  <!-- Code Context Window -->
  <rect x="705" y="210" width="230" height="55" rx="6" fill="#10b981" opacity="0.12" stroke="#10b981" stroke-width="1.5"/>
  <text x="820" y="230" font-size="11" font-weight="bold" text-anchor="middle" fill="#d1fae5" font-family="monospace">Persistent Context</text>
  <text x="820" y="250" font-size="10" text-anchor="middle" fill="#a7f3d0" font-family="monospace">File Structure, History</text>
  
  <!-- Agent capabilities -->
  <g>
    <!-- Understanding -->
    <circle cx="735" cy="330" r="18" fill="none" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="735" y="337" font-size="14" font-weight="bold" text-anchor="middle" fill="#06b6d4">◆</text>
    <text x="820" y="337" font-size="11" fill="#cffafe" font-family="system-ui">Code Understanding</text>
    
    <!-- Refactoring -->
    <circle cx="735" cy="385" r="18" fill="none" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="735" y="392" font-size="14" font-weight="bold" text-anchor="middle" fill="#8b5cf6">⟳</text>
    <text x="820" y="392" font-size="11" fill="#d8b4fe" font-family="system-ui">Smart Refactoring</text>
    
    <!-- Generation -->
    <circle cx="735" cy="440" r="18" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="735" y="447" font-size="14" font-weight="bold" text-anchor="middle" fill="#3b82f6">✦</text>
    <text x="820" y="447" font-size="11" fill="#93c5fd" font-family="system-ui">Code Generation</text>
  </g>
  
  <!-- Session memory -->
  <rect x="705" y="520" width="230" height="50" rx="6" fill="none" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="820" y="540" font-size="11" font-weight="bold" text-anchor="middle" fill="#67e8f9" font-family="monospace">Session Memory</text>
  <text x="820" y="560" font-size="10" text-anchor="middle" fill="#22d3ee" font-family="monospace">State Persistence</text>
  
  <!-- Far right: Output -->
  <rect x="1020" y="120" width="140" height="480" rx="8" fill="none" stroke="#06b6d4" stroke-width="2"/>
  <rect x="1020" y="120" width="140" height="50" rx="8" fill="#06b6d4" opacity="0.1"/>
  <text x="1090" y="155" font-size="13" font-weight="bold" text-anchor="middle" fill="#06b6d4" font-family="system-ui">
    Output
  </text>
  
  <!-- Output items -->
  <g>
    <rect x="1040" y="210" width="100" height="35" rx="4" fill="none" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="1090" y="232" font-size="10" text-anchor="middle" fill="#67e8f9" font-family="system-ui">Suggestions</text>
    
    <rect x="1040" y="280" width="100" height="35" rx="4" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="1090" y="302" font-size="10" text-anchor="middle" fill="#93c5fd" font-family="system-ui">Code Changes</text>
    
    <rect x="1040" y="350" width="100" height="35" rx="4" fill="none" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="1090" y="372" font-size="10" text-anchor="middle" fill="#d8b4fe" font-family="system-ui">Explanations</text>
    
    <rect x="1040" y="420" width="100" height="35" rx="4" fill="none" stroke="#10b981" stroke-width="1.5"/>
    <text x="1090" y="442" font-size="10" text-anchor="middle" fill="#d1fae5" font-family="system-ui">Refactorings</text>
  </g>
  
  <!-- Arrows showing data flow -->
  
  <!-- Input to LSP -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#64748b"/>
    </marker>
  </defs>
  
  <!-- User input to LSP -->
  <path d="M 280 280 Q 310 280 340 280" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- LSP to Agent -->
  <path d="M 620 280 Q 650 280 680 280" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Agent to Output -->
  <path d="M 960 280 Q 990 280 1020 280" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Feedback loop (dashed) -->
  <path d="M 820 600 Q 480 620 160 600" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,5" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Tags -->
  <g opacity="0.7">
    <rect x="50" y="600" width="80" height="18" rx="3" fill="none" stroke="#3b82f6" stroke-width="1"/>
    <text x="90" y="611" font-size="10" text-anchor="middle" fill="#3b82f6" font-family="system-ui">LSP</text>
    
    <rect x="150" y="600" width="100" height="18" rx="3" fill="none" stroke="#8b5cf6" stroke-width="1"/>
    <text x="200" y="611" font-size="10" text-anchor="middle" fill="#8b5cf6" font-family="system-ui">AI Agents</text>
    
    <rect x="270" y="600" width="100" height="18" rx="3" fill="none" stroke="#06b6d4" stroke-width="1"/>
    <text x="320" y="611" font-size="10" text-anchor="middle" fill="#06b6d4" font-family="system-ui">Persistence</text>
    
    <rect x="390" y="600" width="90" height="18" rx="3" fill="none" stroke="#10b981" stroke-width="1"/>
    <text x="435" y="611" font-size="10" text-anchor="middle" fill="#10b981" font-family="system-ui">Flutter/Dart</text>
  </g>
</svg>