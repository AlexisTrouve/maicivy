<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" width="1200" height="630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0f172a"/>
  
  <!-- Grid pattern for texture -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.5"/>
  
  <!-- Title -->
  <text x="600" y="50" font-size="42" font-weight="700" fill="#f1f5f9" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
    262 Tests, 12 Bugs, Production Ready
  </text>
  
  <!-- Subtitle line -->
  <line x1="150" y1="70" x2="1050" y2="70" stroke="#3b82f6" stroke-width="2" opacity="0.6"/>
  
  <!-- Left side: Testing -->
  <g>
    <!-- Test box -->
    <rect x="50" y="120" width="220" height="140" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <text x="160" y="155" font-size="18" font-weight="600" fill="#3b82f6" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
      Testing
    </text>
    <text x="160" y="185" font-size="14" fill="#94a3b8" text-anchor="middle" font-family="system-ui, -apple-system, monospace">
      262 Tests
    </text>
    <text x="160" y="210" font-size="13" fill="#64748b" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
      Coverage
    </text>
    <text x="160" y="230" font-size="13" fill="#64748b" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
      Validation
    </text>
  </g>
  
  <!-- Center: API Proxy (main component) -->
  <g>
    <!-- Main proxy box -->
    <rect x="380" y="100" width="440" height="180" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="3"/>
    <text x="600" y="135" font-size="20" font-weight="700" fill="#8b5cf6" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
      API Proxy (Go)
    </text>
    
    <!-- Internal components -->
    <!-- Quota -->
    <rect x="395" y="155" width="95" height="45" rx="6" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="442" y="172" font-size="11" font-weight="600" fill="#06b6d4" text-anchor="middle" font-family="system-ui, -apple-system, monospace">
      Atomic
    </text>
    <text x="442" y="187" font-size="11" font-weight="600" fill="#06b6d4" text-anchor="middle" font-family="system-ui, -apple-system, monospace">
      Quota
    </text>
    
    <!-- SSE -->
    <rect x="515" y="155" width="95" height="45" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <text x="562" y="172" font-size="11" font-weight="600" fill="#10b981" text-anchor="middle" font-family="system-ui, -apple-system, monospace">
      SSE
    </text>
    <text x="562" y="187" font-size="11" font-weight="600" fill="#10b981" text-anchor="middle" font-family="system-ui, -apple-system, monospace">
      Parsing
    </text>
    
    <!-- Sessions -->
    <rect x="635" y="155" width="95" height="45" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="682" y="172" font-size="11" font-weight="600" fill="#f59e0b" text-anchor="middle" font-family="system-ui, -apple-system, monospace">
      Sticky
    </text>
    <text x="682" y="187" font-size="11" font-weight="600" fill="#f59e0b" text-anchor="middle" font-family="system-ui, -apple-system, monospace">
      Sessions
    </text>
    
    <!-- Bottom label -->
    <text x="600" y="225" font-size="12" fill="#94a3b8" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
      Production-Ready Architecture
    </text>
  </g>
  
  <!-- Right side: Admin Dashboard -->
  <g>
    <!-- Flutter box -->
    <rect x="930" y="120" width="220" height="140" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="1040" y="155" font-size="18" font-weight="600" fill="#10b981" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
      Admin Dashboard
    </text>
    <text x="1040" y="185" font-size="14" fill="#94a3b8" text-anchor="middle" font-family="system-ui, -apple-system, monospace">
      Flutter
    </text>
    <text x="1040" y="210" font-size="13" fill="#64748b" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
      Real-time Stats
    </text>
    <text x="1040" y="230" font-size="13" fill="#64748b" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
      Monitoring
    </text>
  </g>
  
  <!-- Arrows: Testing -> Proxy -->
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#10b981"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8b5cf6"/>
    </marker>
  </defs>
  
  <path d="M 270 190 L 380 190" stroke="#3b82f6" stroke-width="2" fill="none" marker-end="url(#arrowBlue)" opacity="0.7"/>
  <path d="M 820 190 L 930 190" stroke="#10b981" stroke-width="2" fill="none" marker-end="url(#arrowGreen)" opacity="0.7"/>
  
  <!-- Bug badges -->
  <g>
    <!-- 12 Bugs label -->
    <rect x="470" y="310" width="260" height="80" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="2" opacity="0.8"/>
    <text x="600" y="335" font-size="28" font-weight="700" fill="#ef4444" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
      12 Critical Bugs
    </text>
    <text x="600" y="360" font-size="13" fill="#fca5a5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif">
      Found & Fixed → Production-Ready
    </text>
    <text x="600" y="380" font-size="12" fill="#94a3b8" text-anchor="middle" font-family="system-ui, -apple-system, monospace">
      Quota • SSE • Sessions • Race Conditions
    </text>
  </g>
  
  <!-- Bottom badges -->
  <g>
    <!-- Go badge -->
    <rect x="80" y="540" width="100" height="50" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5" opacity="0.8"/>
    <text x="130" y="570" font-size="14" font-weight="600" fill="#3b82f6" text-anchor="middle" font-family="system-ui, -apple-system, monospace">
      Go
    </text>
  </g>
  
  <g>
    <!-- Flutter badge -->
    <rect x="220" y="540" width="100" height="50" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.5" opacity="0.8"/>
    <text x="270" y="570" font-size="14" font-weight="600" fill="#10b981" text-anchor="middle" font-family="system-ui, -apple-system, monospace">
      Flutter
    </text>
  </g>
  
  <g>
    <!-- Proxy badge -->
    <rect x="360" y="540" width="100" height="50" rx="6" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.5" opacity="0.8"/>
    <text x="410" y="570" font-size="14" font-weight="600" fill="#8b5cf6" text-anchor="middle" font-family="system-ui, -apple-system, monospace">
      Proxy
    </text>
  </g>
  
  <g>
    <!-- Testing badge -->
    <rect x="500" y="540" width="100" height="50" rx="6" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5" opacity="0.8"/>
    <text x="550" y="570" font-size="14" font-weight="600" fill="#06b6d4" text-anchor="middle" font-family="system-ui, -apple-system, monospace">
      Testing
    </text>
  </g>
  
  <g>
    <!-- SSE badge -->
    <rect x="640" y="540" width="100" height="50" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" opacity="0.8"/>
    <text x="690" y="570" font-size="14" font-weight="600" fill="#f59e0b" text-anchor="middle" font-family="system-ui, -apple-system, monospace">
      SSE
    </text>
  </g>
  
  <!-- Corner accent -->
  <circle cx="1150" cy="580" r="35" fill="none" stroke="#8b5cf6" stroke-width="2" opacity="0.4"/>
  <circle cx="1150" cy="580" r="28" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.3"/>
</svg>